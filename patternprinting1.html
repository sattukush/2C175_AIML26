<!DOCTYPE html>
<html lang="en">
<head>

    <title>Pattern</title>
    <script>
        function Display(){
            let num = parseInt(prompt("Enter your number: ", ));
            for(let i=0; i<num; i++){
                for(let j=0; j<=i; j++){
                    document.write("*");
                }
                document.write("<br>");
           }
           for(let i=n-1;i<n;i--){
            for(let j=0;j<2*i-1;j++){
                 document.write("<br>");
            }
           }

        }
    </script>
</head>

<body>

    <input type="button" onclick="Display()" value="display">
     <input type="button" onclick="Display()" value="display">

</body>
</html>
